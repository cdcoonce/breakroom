# AFK config — breakroom.
# Trunk is main. The executor gate mirrors CI: lint first, then the deterministic tests.
test_command = "uv run ruff check . && uv run pytest -q"
permission_mode = "acceptEdits"
trunk_branch = "main"

# Forwarded to the headless agent as --allowedTools. Without this, fresh worktrees cannot
# run Bash unattended and slices block before the gate proves anything.
allowed_tools = [
  "Bash(uv sync:*)",
  "Bash(uv run ruff:*)",
  "Bash(uv run pytest:*)",
  "Bash(uv run python:*)",
  "Bash(uv --version:*)",
  "Bash(python3:*)",
  "Bash(python:*)",
]

agent_prompt = """Implement the linked GitHub issue using test-driven development \
(red-green-refactor). Keep changes minimal and scoped to the issue's acceptance criteria. \
Preserve the core invariants: outcomes are computed by code, events are append-only, and \
scene briefs are assembled from structured state rather than freeform transcript memory. \
Never make live model calls in tests or CI."""

# auto_promote is ON, but gated on a cold read rather than on hand-promotion.
#
# The rule this repo has always run by is unchanged: every slice here is a
# hand-authored spec off the #1 PRD, not a scout proposal, and a wrong spec that
# reads consistently still builds and still ships wrong — so nothing is promoted
# until a fresh cold reader has cleared it. What changed (2026-08-09) is that the
# rule is now ENFORCED by the policy instead of by remembering to promote by hand:
# `cold-read:pass` is a required label, so auto-promote can only ever pick issues
# that already carry a BUILD verdict from a reader that did not shape them.
#
# Measured before enabling: 0 of the 45 promotable open issues carry
# `cold-read:pass`, so this is inert until cold reads are done — which is the
# correct bottleneck to have. A `cold-read:rewrite` or `cold-read:blocked` issue
# can never be picked up.
#
# Table form, not the top-level bool: the two cannot coexist (duplicate key), and
# `required_labels` only exists inside this table. The afk#938 hazard was nesting
# under [cycle], where the loader never looks — [auto_promote] is read correctly.
[auto_promote]
enabled = true
required_labels = ["proposed", "afk-sized", "cold-read:pass"]

[caps]
max_retries = 2
timeout_seconds = 1800

[model]
cheap = "sonnet"
frontier = "opus"
default_tier = "cheap"

[cycle]
producers = ["scout", "harvest"]
