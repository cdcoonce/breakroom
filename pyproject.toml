[project]
name = "breakroom"
version = "0.0.1"
description = "An office-tower drama sim with code-owned world resolution and AI-rendered character scenes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
breakroom = "breakroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
